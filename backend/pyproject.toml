[project]
name = "movietranslator-backend"
version = "0.1.0"
description = "MovieTranslator backend: extract audio, transcribe with faster-whisper, translate subtitles with a global-context LLM protocol, and emit SRT."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # 17.0 is the floor for add_mux_stream (the mov_text track in mux.py);
    # add_stream_from_template, used since the first embed release, needs 14.0 —
    # the old >=12.0 floor was never actually satisfiable by this code.
    "av>=17.0",
    # 1.1 is the floor for WhisperModel.detect_language, used to choose the
    # source-language sample sentence when the language is set to auto
    # (asr._pick_exemplar).
    "faster-whisper>=1.1",
    # MCP server (services/mcp_server.py). Held below 2.0 on purpose: that
    # line switched to httpx2 and pydantic>=2.12, which risks pulling the
    # openai/fastapi dependency tree apart for a feature that is off by
    # default. 1.x has the FastMCP + streamable_http_app surface we use.
    "mcp>=1.16,<2",
    "openai>=1.30",
    "pillow>=10.0",
    "platformdirs>=4.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# Local OCR for graphic subtitle tracks (services/ocr.py). Kept out of the
# base install because rapidocr brings opencv/shapely/pyclipper with it —
# 100MB+ for a feature only Blu-ray rips need. The vision-model engine
# needs none of this.
ocr = ["rapidocr>=3.0", "onnxruntime>=1.17"]
# CUDA runtime libraries for GPU inference (NVIDIA GPU required)
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
