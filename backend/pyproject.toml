[project]
name = "movietranslator-backend"
version = "0.1.0"
description = "MovieTranslator backend: extract audio, transcribe with faster-whisper, translate subtitles with a global-context LLM protocol, and emit SRT."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "av>=12.0",
    "faster-whisper>=1.0",
    # MCP server (services/mcp_server.py). Held below 2.0 on purpose: that
    # line switched to httpx2 and pydantic>=2.12, which risks pulling the
    # openai/fastapi dependency tree apart for a feature that is off by
    # default. 1.x has the FastMCP + streamable_http_app surface we use.
    "mcp>=1.16,<2",
    "openai>=1.30",
    "pillow>=10.0",
    "platformdirs>=4.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# CUDA runtime libraries for GPU inference (NVIDIA GPU required)
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
